<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StorageIQ · Live Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  /* ─────────────────────────────────────────────
     CONFIGURE: set your GitHub repo here
     Format: "username/repo-name"
     The repo must have data/accounts.json at its root
  ───────────────────────────────────────────── */

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#050B18;--bg2:#080F20;--bg3:#0D1628;--bg4:#111E35;
    --cyan:#00D4FF;--cyan2:#00A8CC;--violet:#7B5EA7;
    --amber:#FFB020;--rose:#FF4D6D;--green:#00E676;
    --text:#E8F0FE;--muted:#6B80A0;--subtle:#1E2D4A;
    --glass:rgba(255,255,255,0.04);--glass2:rgba(0,212,255,0.06);
    --border:rgba(255,255,255,0.07);--border-cyan:rgba(0,212,255,0.2);
  }
  html{font-size:14px;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}

  /* ── Layout ── */
  .layout{display:flex;min-height:100vh}
  .sidebar{width:220px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;transition:transform .28s cubic-bezier(.4,0,.2,1)}
  .main{flex:1;display:flex;flex-direction:column;overflow-x:hidden}

  /* ── Sidebar ── */
  .sidebar-logo{padding:24px 20px 16px;border-bottom:1px solid var(--border)}
  .logo-mark{display:flex;align-items:center;gap:10px}
  .logo-hex{width:32px;height:32px;background:linear-gradient(135deg,var(--cyan),var(--violet));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .logo-text{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px}
  .logo-sub{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .logo-version{font-size:9px;color:var(--violet);font-family:'Space Mono',monospace;margin-top:2px}
  .nav{padding:16px 12px;flex:1}
  .nav-section{margin-bottom:24px}
  .nav-label{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;padding:0 8px;margin-bottom:8px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;transition:all .15s;margin-bottom:2px}
  .nav-item:hover{background:var(--glass);color:var(--text)}
  .nav-item.active{background:var(--glass2);color:var(--cyan);border:1px solid var(--border-cyan)}
  .nav-icon{font-size:16px;width:20px;text-align:center}
  .nav-badge{margin-left:auto;background:var(--rose);color:#fff;font-size:10px;padding:1px 6px;border-radius:20px;font-weight:600}

  /* ── Sidebar accounts ── */
  .sidebar-accounts{padding:12px 14px;border-top:1px solid var(--border)}
  .sidebar-accounts-label{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;padding:0 4px}
  .acct-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;transition:all .15s;margin-bottom:4px;border:1px solid transparent}
  .acct-item:hover{background:var(--glass)}
  .acct-item.acct-active{background:var(--glass2);border-color:var(--border-cyan)}
  .acct-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0;position:relative}
  .acct-avatar-dot{position:absolute;bottom:0;right:0;width:8px;height:8px;border-radius:50%;border:2px solid var(--bg2)}
  .acct-info{flex:1;min-width:0}
  .acct-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acct-email{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acct-storage-mini{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);flex-shrink:0}
  .acct-add-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:500;border:1px dashed var(--border);margin-top:4px;transition:all .15s;background:none;width:100%;font-family:'Inter',sans-serif}
  .acct-add-btn:hover{border-color:var(--border-cyan);color:var(--cyan);background:var(--glass2)}
  .acct-add-icon{width:26px;height:26px;border-radius:50%;background:var(--subtle);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}

  /* ── Top Bar ── */
  .topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:14px;flex-shrink:0;flex-wrap:wrap}
  .topbar-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;flex:0 0 auto}
  .acct-slicer{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:4px 6px;overflow-x:auto;max-width:380px;scrollbar-width:none;flex:1}
  .acct-slicer::-webkit-scrollbar{display:none}
  .slicer-chip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;cursor:pointer;transition:all .15s;white-space:nowrap;border:1px solid transparent;flex-shrink:0}
  .slicer-chip:hover{background:var(--glass)}
  .slicer-chip.slicer-active{background:var(--glass2);border-color:var(--border-cyan)}
  .slicer-all{font-size:11px;font-weight:600;color:var(--muted)}
  .slicer-all.slicer-active{color:var(--cyan)}
  .slicer-chip-avatar{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0}
  .slicer-chip-label{font-size:11px;font-weight:500;color:var(--muted)}
  .slicer-chip.slicer-active .slicer-chip-label{color:var(--text)}
  .slicer-divider{width:1px;height:20px;background:var(--border);flex-shrink:0}
  .slicer-add-chip{display:flex;align-items:center;gap:4px;padding:5px 8px;border-radius:7px;cursor:pointer;border:1px dashed var(--border);font-size:11px;color:var(--muted);transition:all .15s;flex-shrink:0}
  .slicer-add-chip:hover{border-color:var(--border-cyan);color:var(--cyan)}

  /* ── Status pill ── */
  .status-pill{display:flex;align-items:center;gap:6px;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:500;border:1px solid;flex-shrink:0}
  .status-pill.live{background:rgba(0,230,118,.08);border-color:rgba(0,230,118,.2);color:var(--green)}
  .status-pill.loading{background:rgba(255,176,32,.08);border-color:rgba(255,176,32,.2);color:var(--amber)}
  .status-pill.error{background:rgba(255,77,109,.08);border-color:rgba(255,77,109,.2);color:var(--rose)}
  .status-dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)}}
  .last-sync{font-size:11px;color:var(--muted);flex-shrink:0}
  .sync-btn{display:flex;align-items:center;gap:6px;background:var(--glass2);border:1px solid var(--border-cyan);color:var(--cyan);padding:7px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;flex-shrink:0}
  .sync-btn:hover{background:rgba(0,212,255,.12);transform:translateY(-1px)}
  .sync-btn:disabled{opacity:.5;cursor:wait;transform:none}

  /* ── GitHub config banner ── */
  .config-banner{display:flex;align-items:center;gap:12px;background:rgba(255,176,32,.06);border:1px solid rgba(255,176,32,.2);border-radius:12px;padding:12px 16px;margin-bottom:20px}
  .config-banner input{flex:1;background:var(--bg4);border:1px solid var(--border);border-radius:7px;padding:6px 10px;color:var(--text);font-size:12px;font-family:'Space Mono',monospace;outline:none;min-width:0}
  .config-banner input:focus{border-color:var(--border-cyan)}
  .config-banner-btn{background:linear-gradient(135deg,var(--cyan2),var(--violet));border:none;border-radius:7px;color:#fff;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;white-space:nowrap;flex-shrink:0}

  /* ── Combined banner ── */
  .combined-banner{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(0,212,255,.06),rgba(123,94,167,.06));border:1px solid var(--border-cyan);border-radius:12px;padding:12px 16px;margin-bottom:20px}
  .combined-banner-icon{font-size:20px}
  .combined-banner-text{flex:1;font-size:12px;color:var(--muted)}
  .combined-banner-text strong{color:var(--text)}
  .combined-chips{display:flex;gap:6px;flex-wrap:wrap}
  .combined-chip{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:600;border:1px solid var(--border-cyan);background:var(--glass2);color:var(--cyan)}

  /* ── Content ── */
  .content{padding:24px 28px;flex:1}

  /* ── GitHub version history strip ── */
  .gh-strip{display:flex;align-items:center;gap:12px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:20px;overflow-x:auto}
  .gh-strip-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;flex-shrink:0}
  .gh-commit{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;background:var(--bg4);border:1px solid var(--border);font-size:10px;color:var(--muted);cursor:pointer;transition:all .15s;flex-shrink:0;text-decoration:none}
  .gh-commit:hover{border-color:var(--border-cyan);color:var(--cyan)}
  .gh-commit-sha{font-family:'Space Mono',monospace;color:var(--cyan)}
  .gh-commit-msg{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gh-commit-time{color:var(--muted);flex-shrink:0}

  /* ── KPI Strip ── */
  .kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
  .kpi{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;transition:border-color .2s}
  .kpi:hover{border-color:var(--border-cyan)}
  .kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent,var(--cyan))}
  .kpi-eyebrow{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;font-weight:500}
  .kpi-value{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;line-height:1;margin-bottom:6px}
  .kpi-value span{font-size:14px;font-weight:500;color:var(--muted);margin-left:2px}
  .kpi-delta{font-size:11px;font-weight:500}
  .kpi-delta.warn{color:var(--rose)} .kpi-delta.good{color:var(--green)}
  .kpi-icon{position:absolute;top:14px;right:14px;font-size:22px;opacity:.25}

  /* ── Galaxy ── */
  .hero-row{display:grid;grid-template-columns:1fr 340px;gap:20px;margin-bottom:24px}
  .galaxy-card{background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:24px;position:relative;overflow:hidden}
  .galaxy-card-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;margin-bottom:4px}
  .galaxy-card-sub{font-size:12px;color:var(--muted);margin-bottom:20px}
  .galaxy-wrap{display:flex;align-items:center;gap:28px}
  .galaxy-canvas-wrap{position:relative;flex-shrink:0}
  #galaxyCanvas{display:block}
  .galaxy-center-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
  .galaxy-total{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;line-height:1}
  .galaxy-total-sub{font-size:11px;color:var(--muted);margin-top:2px}
  .galaxy-legend{flex:1}
  .legend-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer}
  .legend-item:last-child{border-bottom:none}
  .legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .legend-label{font-size:12px;font-weight:500;flex:1}
  .legend-size{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted)}
  .legend-pct{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);margin-left:8px;min-width:36px;text-align:right}

  /* ── Storage summary ── */
  .storage-summary{background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:24px}
  .storage-header{margin-bottom:18px}
  .storage-header h3{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;margin-bottom:4px}
  .storage-header p{font-size:12px;color:var(--muted)}
  .storage-bar-outer{background:var(--subtle);border-radius:6px;height:8px;margin-bottom:18px;overflow:hidden}
  .storage-bar-inner{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width 1.2s cubic-bezier(.4,0,.2,1);position:relative}
  .storage-bar-inner::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25));animation:shimmer 2s infinite}
  @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .storage-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat-box{background:var(--bg4);border-radius:10px;padding:12px 14px}
  .stat-box-label{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
  .stat-box-val{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700}
  .stat-box-val.cyan{color:var(--cyan)}.stat-box-val.green{color:var(--green)}.stat-box-val.amber{color:var(--amber)}.stat-box-val.rose{color:var(--rose)}
  .health-score{margin-top:16px;background:var(--bg4);border-radius:10px;padding:14px}
  .health-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .health-label{font-size:12px;font-weight:500}
  .health-grade{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700}
  .health-bar{background:var(--subtle);border-radius:4px;height:4px}
  .health-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--rose),var(--amber),var(--green));transition:width 1.5s ease}

  /* ── Service grid (dynamic) ── */
  .section-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:10px}
  .section-title::after{content:'';flex:1;height:1px;background:var(--border)}
  .service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
  .service-card{background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
  .service-card:hover{border-color:var(--border-cyan);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,212,255,.08)}
  .service-card-glow{position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;opacity:.06;filter:blur(16px)}
  .service-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .service-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .service-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px}
  .service-type{font-size:11px;color:var(--muted)}
  .meter-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
  .meter-label{font-size:11px;color:var(--muted)}
  .meter-val{font-family:'Space Mono',monospace;font-size:11px}
  .meter-bar{background:var(--subtle);border-radius:4px;height:5px;overflow:hidden;margin-bottom:12px}
  .meter-fill{height:100%;border-radius:4px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
  .service-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
  .tag{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500}
  .tag.warning{background:rgba(255,176,32,.1);color:var(--amber);border:1px solid rgba(255,176,32,.2)}
  .tag.danger{background:rgba(255,77,109,.1);color:var(--rose);border:1px solid rgba(255,77,109,.2)}
  .tag.ok{background:rgba(0,230,118,.08);color:var(--green);border:1px solid rgba(0,230,118,.15)}
  .tag.info{background:rgba(0,212,255,.08);color:var(--cyan);border:1px solid rgba(0,212,255,.15)}
  .service-stats-row{display:flex;border-top:1px solid var(--border);padding-top:12px}
  .sstat{flex:1;text-align:center}
  .sstat:not(:last-child){border-right:1px solid var(--border)}
  .sstat-val{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700}
  .sstat-label{font-size:9px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:2px}

  /* ── Recommendations ── */
  .reco-card{background:linear-gradient(135deg,rgba(123,94,167,.12),rgba(0,212,255,.06));border:1px solid var(--border-cyan);border-radius:14px;padding:20px;margin-bottom:24px}
  .reco-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .reco-icon{font-size:24px}
  .reco-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px}
  .reco-sub{font-size:12px;color:var(--muted)}
  .reco-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .reco-item{background:var(--bg3);border-radius:10px;padding:14px;border:1px solid var(--border)}
  .reco-priority{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
  .reco-priority.high{color:var(--rose)}.reco-priority.med{color:var(--amber)}.reco-priority.low{color:var(--green)}
  .reco-text{font-size:12px;line-height:1.5;margin-bottom:8px}
  .reco-save{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--green)}

  /* ── Toast ── */
  .toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--green);border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:10px;font-size:13px;box-shadow:0 8px 32px rgba(0,0,0,.4);transform:translateY(80px);opacity:0;transition:all .3s;z-index:200}
  .toast.show{transform:translateY(0);opacity:1}
  .toast-icon{font-size:18px}

  /* ── Modal ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(5,11,24,.8);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .modal-overlay.open{opacity:1;pointer-events:all}
  .modal{background:var(--bg3);border:1px solid var(--border-cyan);border-radius:16px;width:520px;max-width:90vw;padding:28px;transform:translateY(16px);transition:transform .25s;box-shadow:0 24px 80px rgba(0,212,255,.1);position:relative}
  .modal-overlay.open .modal{transform:translateY(0)}
  .modal-title{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;margin-bottom:4px}
  .modal-sub{font-size:12px;color:var(--muted);margin-bottom:20px}
  .modal-close{position:absolute;top:16px;right:16px;cursor:pointer;font-size:18px;color:var(--muted);background:none;border:none;padding:4px 8px;border-radius:6px}
  .modal-close:hover{color:var(--text)}
  .modal-step{display:flex;align-items:flex-start;gap:12px;padding:12px;background:var(--bg4);border-radius:10px;margin-bottom:8px}
  .step-num{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--cyan2),var(--violet));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
  .step-text{font-size:12px;line-height:1.5}
  .modal-btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--cyan2),var(--violet));border:none;border-radius:10px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:opacity .2s;margin-top:8px}
  .modal-btn:hover{opacity:.85}

  /* ── Footer ── */
  .footer{padding:16px 28px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .footer-note{font-size:11px;color:var(--muted)}
  .footer-links{display:flex;gap:16px}
  .footer-link{font-size:11p
